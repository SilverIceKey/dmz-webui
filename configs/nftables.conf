#!/usr/sbin/nft -f

table inet dmz_webui_filter {
    set ssh_ports {
        type inet_service
        elements = { <SSH_PORT> }
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iif "lo" accept
        tcp dport @ssh_ports accept
        tcp dport 5000 accept
        tcp dport 8443 accept
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct status dnat accept
        ct status snat accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip dmz_webui_nat {
    set cn_ipv4 {
        type ipv4_addr
        flags interval
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept
        # 示例：tcp dport <EXTERNAL_PORT> dnat to <TARGET_IP>:<TARGET_PORT>
        # 请根据实际内网服务地址修改，或使用 WebUI 动态添加规则
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept
        oif "<WAN_INTERFACE>" masquerade
    }
}
